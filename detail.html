<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pilih Desain | Markas Cetak Custom</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#e6f6f6;
}

header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:#25b9b9;
  color:white;
}

header span{
  cursor:pointer;
  font-size:20px;
}

.card{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:15px;
}

.card img.main{
  width:100%;
  border-radius:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:10px;
}

.desain{
  border-radius:12px;
  overflow:hidden;
  border:3px solid transparent;
  cursor:pointer;
}

.desain img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.desain p{
  margin:0;
  padding:8px;
  text-align:center;
  font-weight:bold;
}

.desain.active{
  border:3px solid #25b9b9;
}

button{
  width:100%;
  padding:15px;
  background:#25b9b9;
  color:white;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <span onclick="history.back()">←</span>
  <b id="judul">Produk</b>
</header>

<section class="card">
  <img id="gambarProduk" class="main">
</section>

<section class="card">
  <h3>Pilih Gaya Desain</h3>

  <div class="grid">
    <div class="desain" onclick="pilihDesain('Minimalis', this)">
      <img src="assets/minimalis.jpg">
      <p>Minimalis</p>
    </div>

    <div class="desain" onclick="pilihDesain('Elegan', this)">
      <img src="assets/elegan.jpg">
      <p>Elegan</p>
    </div>

    <div class="desain" onclick="pilihDesain('Modern', this)">
      <img src="assets/modern.jpg">
      <p>Modern</p>
    </div>
  </div>
</section>

<section class="card">
  <button onclick="lanjut()">Lanjut ke Pemesanan</button>
</section>

<script>
/* DATA PRODUK */
const produkData = {
  "Souvenir Nikahan":"assets/nikahan.jpg",
  "Souvenir Kantor":"assets/kantor.jpg",
  "Souvenir Custom":"assets/custom.jpg",
  "Mug Custom":"assets/mug.jpg",
  "Tumbler":"assets/tumbler.jpg",
  "Gantungan":"assets/gantungan.jpg"
};

/* AMBIL PARAMETER URL */
const params = new URLSearchParams(window.location.search);
const produk = params.get("produk");

let desainTerpilih = "";

/* SET JUDUL & GAMBAR */
document.getElementById("judul").innerText = produk || "Produk";
document.getElementById("gambarProduk").src =
  produkData[produk] || "assets/nikahan.jpg";

/* PILIH DESAIN */
function pilihDesain(nama, el){
  desainTerpilih = nama;
  document.querySelectorAll(".desain").forEach(d=>{
    d.classList.remove("active");
  });
  el.classList.add("active");
}

/* LANJUT KE CHECKOUT */
function lanjut(){
  if(!desainTerpilih){
    alert("Silakan pilih desain terlebih dahulu");
    return;
  }
  window.location =
    "index.html?produk="+encodeURIComponent(produk)+
    "&desain="+encodeURIComponent(desainTerpilih);
}
</script>

</body>
</html>
